name: glide

# Downstream-only checks. Upstream's workflows stay as upstream wrote them.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glide-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  layout-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing fork convention
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream main
        run: git fetch --no-tags https://github.com/alt-glitch/hermes-tern.git main:refs/remotes/upstream/main
      - name: Downstream code stays in glide/
        run: python3 glide/tools/check_layout.py --upstream upstream/main
      - name: Removed Hermes integrations stay removed
        run: python3 glide/tools/check_upstream_sync.py
      - name: No machine paths, tailnet hosts, personal emails or credentials (repo is public)
        run: python3 glide/tools/check_privacy.py --upstream upstream/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Glide tests (test_memory_core needs a hermes-agent checkout; run it locally)
        working-directory: glide
        run: |
          python -m pip install --quiet pytest pydantic  # pydantic ships with Hermes at runtime
          python -m pytest -q --ignore=tests/test_memory_core.py
