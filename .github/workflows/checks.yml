# The checks main's ruleset requires (`python`, `frontend`), and the frontend's other gates in jobs
# of their own so a failure names what broke. The frontend jobs build against the hermes-agent
# commit in frontend/hermes-src.lock: the bundle inlines ui-tui and apps/shared from it.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --no-project --python 3.11 --with pytest python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        # The lock comes from the PR: accept only a full commit SHA as checkout's ref.
        run: |
          sha=$(tr -d '[:space:]' < hermes-src.lock)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=frontend/hermes-src.lock::not a commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.lock.outputs.sha }}
          path: .hermes-agent
          persist-credentials: false
      # ui-tui's own packages, from Hermes' lockfile: the bundle inlines some of them (undici).
      - run: npm ci --ignore-scripts --workspace ui-tui --no-audit --no-fund
        working-directory: .hermes-agent
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: node scripts/hermes-src.mjs && bun install --frozen-lockfile
        env:
          HERMES_SRC: ${{ github.workspace }}/.hermes-agent
      - name: typecheck
        run: bun run typecheck
      - name: tests (unit, app and golden replays)
        run: bun run test

  lint:
    name: lint and ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        # The lock comes from the PR: accept only a full commit SHA as checkout's ref.
        run: |
          sha=$(tr -d '[:space:]' < hermes-src.lock)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=frontend/hermes-src.lock::not a commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.lock.outputs.sha }}
          path: .hermes-agent
          persist-credentials: false
      # ui-tui's own packages, from Hermes' lockfile: the bundle inlines some of them (undici).
      - run: npm ci --ignore-scripts --workspace ui-tui --no-audit --no-fund
        working-directory: .hermes-agent
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: node scripts/hermes-src.mjs && bun install --frozen-lockfile
        env:
          HERMES_SRC: ${{ github.workspace }}/.hermes-agent
      - name: lint
        run: bun run lint
      - name: file sizes
        run: bun run check:size
      - name: strictness
        run: bun run check:strict
      - name: suppressions
        run: bun run check:suppressions

  bundle:
    name: bundle is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        # The lock comes from the PR: accept only a full commit SHA as checkout's ref.
        run: |
          sha=$(tr -d '[:space:]' < hermes-src.lock)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=frontend/hermes-src.lock::not a commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.lock.outputs.sha }}
          path: .hermes-agent
          persist-credentials: false
      # ui-tui's own packages, from Hermes' lockfile: the bundle inlines some of them (undici).
      - run: npm ci --ignore-scripts --workspace ui-tui --no-audit --no-fund
        working-directory: .hermes-agent
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: node scripts/hermes-src.mjs && bun install --frozen-lockfile
        env:
          HERMES_SRC: ${{ github.workspace }}/.hermes-agent
      - name: rebuild and compare with dist/entry.js
        run: |
          TSP_OUT="$RUNNER_TEMP/entry.js" node scripts/build.mjs
          cmp "$RUNNER_TEMP/entry.js" dist/entry.js || {
            echo "::error file=frontend/dist/entry.js::dist/entry.js is stale: run 'bun run bundle' and commit it"
            exit 1
          }
