# The checks main's ruleset requires (`python`, `frontend`), and the frontend's other gates in jobs
# of their own so a failure names what broke. The frontend jobs build against the hermes-agent
# commit in frontend/hermes-src.lock: the bundle inlines apps/shared (`@hermes/shared`) from it.
# Main's required checks are python and frontend. CI runs on the exact PR head,
# with read-only repository permissions and fail-closed pin/install/test attestations.
name: checks

on:
  pull_request:
  push:
    branches: [main, 'integration/nightly-*']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_PLUGIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_RECEIPT: ${{ github.workspace }}/ci-python-pin.json
      # Existing qualified test-only plugin seam. NOT the frontend runtime pin.
      HERMES_TEST_CORE_SHA: 0ac4e9df39eecf3ce69a3ea3c80a6dc70dd7dcd5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_PLUGIN_SHA }}
          persist-credentials: false
      - name: Validate declared runtime pin
        run: python tests/test_ci_pin_contract.py pin --lock frontend/hermes-src.lock
      - name: Initialize Python checkout and command receipt
        run: |
          python tests/test_ci_pin_contract.py init \
            --receipt "$CI_RECEIPT" --plugin "$EXPECTED_PLUGIN_SHA" \
            --hermes "$HERMES_TEST_CORE_SHA" --kind test-only-core \
            --command 'uv sync --project .hermes-agent --frozen --python 3.14' \
            --command 'uv run --project .hermes-agent --frozen --no-sync --with pytest --with pytest-asyncio python -m pytest -q --junitxml=$RUNNER_TEMP/ci-python.xml'
      # Python RPC dispatch tests require the separately reviewed public plugin seam.
      # The plugin's runtime pin remains frontend/hermes-src.lock, untouched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kvnloo/hermes-agent
          ref: ${{ env.HERMES_TEST_CORE_SHA }}
          path: .hermes-agent
          persist-credentials: false
      - name: Verify exact test-core checkout
        run: python tests/test_ci_pin_contract.py checkout --receipt "$CI_RECEIPT" --repo .hermes-agent
      - name: Offline fail-closed contract controls
        run: python -m unittest discover -s tests -p test_ci_pin_contract.py -v
      - name: Record executed contract controls
        run: python tests/test_ci_pin_contract.py stage --receipt "$CI_RECEIPT" --what controls
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Hermes' lock covers Python 3.14. Do not install a second plugin environment.
      - name: Install locked Hermes test-core dependencies
        run: uv sync --project .hermes-agent --frozen --python 3.14
      - name: Verify dependency installation before pytest
        run: |
          python tests/test_ci_pin_contract.py installed --receipt "$CI_RECEIPT" \
            --repo .hermes-agent \
            --marker .hermes-agent/uv.lock \
            --marker .hermes-agent/.venv/pyvenv.cfg
      - name: Plugin Python suite (JUnit must contain passing tests)
        run: uv run --project .hermes-agent --frozen --no-sync --with pytest --with pytest-asyncio python -m pytest -q --junitxml="$RUNNER_TEMP/ci-python.xml"
      - name: Validate actual Python results
        run: |
          python tests/test_ci_pin_contract.py result --receipt "$CI_RECEIPT" \
            --repo .hermes-agent --junit "$RUNNER_TEMP/ci-python.xml"
      - name: Publish Python pin/test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-python-pin-receipt
          path: |
            ${{ github.workspace }}/ci-python-pin.json
            ${{ runner.temp }}/ci-python.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PLUGIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_RECEIPT: ${{ github.workspace }}/ci-frontend-pin.json
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_PLUGIN_SHA }}
          persist-credentials: false
      - id: lock
        # Exact runtime commit read from the current PR, never a moving branch.
        run: |
          sha=$(python ../tests/test_ci_pin_contract.py pin --lock hermes-src.lock)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Initialize frontend checkout and command receipt
        working-directory: ${{ github.workspace }}
        run: |
          python tests/test_ci_pin_contract.py init \
            --receipt "$CI_RECEIPT" --plugin "$EXPECTED_PLUGIN_SHA" \
            --hermes "${{ steps.lock.outputs.sha }}" --kind runtime-pin \
            --command 'node scripts/hermes-src.mjs && bun install --frozen-lockfile' \
            --command 'uv sync --project .hermes-agent --frozen --python 3.14' \
            --command 'bun run typecheck' \
            --command 'bun run test --reporter=junit --outputFile=$RUNNER_TEMP/ci-frontend.xml' \
            --command 'bun run bundle'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.lock.outputs.sha }}
          path: .hermes-agent
          persist-credentials: false
      - name: Verify actual pinned runtime checkout
        working-directory: ${{ github.workspace }}
        run: |
          python tests/test_ci_pin_contract.py checkout --receipt "$CI_RECEIPT" \
            --repo .hermes-agent --pin-file frontend/hermes-src.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Includes the self-contained OpenUI workspace, with Bun frozen lock.
      - run: node scripts/hermes-src.mjs && bun install --frozen-lockfile
        env:
          HERMES_SRC: ${{ github.workspace }}/.hermes-agent
          OPENUI_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'
      # Existing Python fixtures import Hermes core from its frozen 3.14 environment.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: |
          uv sync --project .hermes-agent --frozen --python 3.14
          echo "$GITHUB_WORKSPACE/.hermes-agent/.venv/bin" >> "$GITHUB_PATH"
        working-directory: ${{ github.workspace }}
      - name: Verify linked source and all installed lock inputs
        working-directory: ${{ github.workspace }}
        run: |
          python tests/test_ci_pin_contract.py installed --receipt "$CI_RECEIPT" \
            --repo frontend/.hermes-src \
            --marker .hermes-agent/uv.lock \
            --marker .hermes-agent/.venv/pyvenv.cfg \
            --marker frontend/bun.lock \
            --marker frontend/node_modules
      - name: typecheck
        run: bun run typecheck
      - name: tests (unit, app, packaged OpenUI and golden replays)
        run: bun run test --reporter=junit --outputFile="$RUNNER_TEMP/ci-frontend.xml"
      - name: Validate actual frontend results
        working-directory: ${{ github.workspace }}
        run: |
          python tests/test_ci_pin_contract.py result --receipt "$CI_RECEIPT" \
            --repo frontend/.hermes-src --junit "$RUNNER_TEMP/ci-frontend.xml"
      - name: Bundle gate (build without committing generated dist)
        run: bun run bundle
        env:
          HERMES_SRC: ${{ github.workspace }}/.hermes-agent
      - name: Record bundle gate
        working-directory: ${{ github.workspace }}
        run: python tests/test_ci_pin_contract.py stage --receipt "$CI_RECEIPT" --what bundle
      - name: Publish runtime pin/test/bundle receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-frontend-pin-receipt
          path: |
            ${{ github.workspace }}/ci-frontend-pin.json
            ${{ runner.temp }}/ci-frontend.xml
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: lint and ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: lock
        run: |
          sha=$(python ../tests/test_ci_pin_contract.py pin --lock hermes-src.lock)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.lock.outputs.sha }}
          path: .hermes-agent
          persist-credentials: false
      - name: Verify actual lint dependency checkout
        working-directory: ${{ github.workspace }}
        run: python tests/test_ci_pin_contract.py require --repo .hermes-agent --sha "${{ steps.lock.outputs.sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: node scripts/hermes-src.mjs && bun install --frozen-lockfile
        env:
          HERMES_SRC: ${{ github.workspace }}/.hermes-agent
          OPENUI_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'
      - name: lint
        run: bun run lint
      - name: file sizes
        run: bun run check:size
      - name: strictness
        run: bun run check:strict
      - name: suppressions
        run: bun run check:suppressions

  bundle:
    name: bundle is built on main
    # PRs carry source only; the separate bundle workflow commits dist on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: the pull request leaves dist/entry.js alone
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE"...HEAD > "$RUNNER_TEMP/changed-files"
          if grep -Fxq 'frontend/dist/entry.js' "$RUNNER_TEMP/changed-files"; then
            echo "::error file=frontend/dist/entry.js::main builds the bundle: drop it with 'git checkout origin/main -- frontend/dist/entry.js' and commit"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::could not inspect changed files"
              exit "$status"
            fi
          fi

